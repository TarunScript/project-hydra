<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project Hydra — India Flood, Drought & Water-Scarcity Early Warning System. Predict flood and drought risk across India with interactive map visualization and 7-15 day alerts.">
  <title>Project Hydra — India Flood & Drought Early Warning System</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />

  <!-- Project CSS -->
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>
  <div id="app">
    <!-- ═══════════════════ HEADER ═══════════════════ -->
    <header class="header" id="header">
      <div class="header__brand">
        <span class="header__logo">🌊</span>
        <div>
          <div class="header__title">Project Hydra</div>
          <div class="header__subtitle">India Early Warning System</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="header__controls">
        <select class="select-control" id="model-select" aria-label="Model type">
          <option value="flood">🌊 Flood Model</option>
          <option value="drought">☀️ Drought Model</option>
        </select>

        <select class="select-control" id="region-select" aria-label="Demo region">
          <option value="assam">Assam</option>
          <option value="marathwada">Marathwada</option>
        </select>

        <span class="model-badge model-badge--flood" id="model-badge">🌊 Flood</span>
      </div>

      <!-- Stats -->
      <div class="header__stats">
        <div class="stat-pill stat-pill--danger">
          <span>🔴 Severe</span>
          <span class="stat-pill__value" id="stat-severe">0</span>
        </div>
        <div class="stat-pill stat-pill--warning">
          <span>⚠️ At Risk</span>
          <span class="stat-pill__value" id="stat-at-risk">0</span>
        </div>
        <div class="stat-pill">
          <span>📊 Cells</span>
          <span class="stat-pill__value" id="stat-total">0</span>
        </div>
        <div class="stat-pill">
          <span>Avg Risk</span>
          <span class="stat-pill__value" id="stat-avg-risk">0.000</span>
        </div>
      </div>
    </header>

    <!-- ═══════════════════ MAIN CONTENT ═══════════════════ -->
    <main class="main-content" id="main-content">

      <!-- Map -->
      <div class="map-container" id="map-container">
        <div id="map"></div>

        <!-- Map Legend -->
        <div class="map-legend" id="map-legend">
          <div class="map-legend__title">Risk Level</div>
          <div class="map-legend__items">
            <div class="map-legend__item">
              <span class="map-legend__color" style="background: #ef4444;"></span>
              Severe (0.75–1.0)
            </div>
            <div class="map-legend__item">
              <span class="map-legend__color" style="background: #f97316;"></span>
              High (0.50–0.75)
            </div>
            <div class="map-legend__item">
              <span class="map-legend__color" style="background: #eab308;"></span>
              Moderate (0.25–0.50)
            </div>
            <div class="map-legend__item">
              <span class="map-legend__color" style="background: #22c55e;"></span>
              Low (0.00–0.25)
            </div>
          </div>
        </div>

        <!-- Sidebar Toggle -->
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle alert panel">▶</button>
      </div>

      <!-- Detail Panel (outside map-container to avoid Leaflet z-index conflicts) -->
      <div class="detail-panel" id="detail-panel">
        <div class="detail-panel__header">
          <div class="detail-panel__title">Cell Details</div>
          <button class="detail-panel__close" id="detail-panel-close" aria-label="Close detail panel">✕</button>
        </div>
        <div class="detail-panel__body" id="detail-panel-body">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Sidebar / Alert Panel -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
          <div class="sidebar__title">
            🔔 Active Alerts
            <span class="sidebar__badge" id="alert-count-badge">0</span>
          </div>
        </div>
        <div class="sidebar__content" id="alert-list">
          <div class="empty-state">
            <div class="empty-state__icon">📡</div>
            <div class="empty-state__text">Loading alerts...</div>
          </div>
        </div>
      </aside>
    </main>

    <!-- ═══════════════════ TIMELINE BAR ═══════════════════ -->
    <footer class="timeline-bar" id="timeline-bar">
      <div class="timeline-bar__controls">
        <button class="timeline-btn" id="btn-prev" aria-label="Previous day">◀</button>
        <button class="timeline-btn" id="btn-play" aria-label="Play/Pause">▶</button>
        <button class="timeline-btn" id="btn-next" aria-label="Next day">▶</button>
        <button class="timeline-btn" id="btn-today" aria-label="Go to today" title="Jump to today">●</button>
      </div>

      <div class="timeline-bar__slider-wrap">
        <div class="timeline-bar__dates" id="timeline-date-labels">
          <!-- Populated by timeline.js -->
        </div>
        <input type="range" class="timeline-slider" id="timeline-slider" 
               min="0" max="29" value="14" step="1" 
               aria-label="Timeline date slider" />
      </div>

      <div class="timeline-bar__current-date">
        <span id="current-date-display">Loading...</span>
        <span class="timeline-bar__forecast-badge" id="forecast-badge" style="display:none;">TODAY</span>
      </div>
    </footer>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- ═══════════════════ SCRIPTS ═══════════════════ -->
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- App modules (order matters: dependencies first) -->
  <script src="js/data-service.js"></script>
  <script src="js/map.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/detail-panel.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
